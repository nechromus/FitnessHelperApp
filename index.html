<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>FitnessHelper</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="bar">
    <h1>FitnessHelper</h1>
    <div class="actions">
      <button id="btn-load" type="button" title="Neu laden">↻</button>
      <button id="btn-settings" type="button" title="Einstellungen">⚙︎</button>
    </div>
  </header>

  <main>
    <p id="status" class="status" role="status"></p>

    <section id="content" hidden>
      <div class="source-line">
        <span id="origin"></span>
        <span id="sample-badge" class="badge" hidden>Beispieldaten</span>
      </div>
      <div id="tiles" class="tiles"></div>
      <h2>Einheiten</h2>
      <ul id="workouts" class="workouts"></ul>
    </section>

    <label class="file-pick">
      JSON-Datei vom Gerät öffnen
      <input id="file" type="file" accept="application/json,.json">
    </label>
  </main>

  <dialog id="settings">
    <form id="settings-form">
      <h2>Datenquelle</h2>
      <label>Repository <input id="f-repo" required autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>Branch <input id="f-branch" required autocomplete="off" autocapitalize="off"></label>
      <label>Datei <input id="f-path" required autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label>GitHub-Token (nur Lesen)
        <input id="f-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
      </label>
      <label class="check"><input id="f-remember" type="checkbox"> Token auf diesem Gerät merken</label>
      <p class="hint">Der Token bleibt nur in diesem Browser und wird ausschließlich an api.github.com gesendet.</p>
      <div class="row">
        <button id="btn-forget" type="button" class="link">Token löschen</button>
        <span class="spacer"></span>
        <button id="btn-cancel" type="button">Abbrechen</button>
        <button type="submit" class="primary">Speichern &amp; laden</button>
      </div>
    </form>
  </dialog>
</body>
</html>
